<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Crear Clan</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>

    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/styles2.css">
    <link rel="stylesheet" href="css/navbar.css">
</head>

<body class="landing-body clean-background2">

<nav class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top">
    <div class="container">

        <ul class="navbar-nav me-auto pixel-font">
            <li class="nav-item">
                <a href="clanes.html" class="nav-link text-light">
                    ⬅ Volver a Clanes
                </a>
            </li>
        </ul>

        <ul class="navbar-nav ms-auto align-items-center pixel-font">
            <li class="nav-item me-3">
                <div class="d-flex align-items-center bg-dark border border-warning rounded px-3 py-1">
                    <span class="me-2">💰</span>
                    <span id="coins-display" class="fw-bold text-white">---</span>
                </div>
            </li>

            <li class="nav-item dropdown">
                <a class="nav-link dropdown-toggle pixel-font" href="#" id="userDropdown"
                   role="button" data-bs-toggle="dropdown">
                    👤 <span id="username-display">Usuari</span>
                </a>

                <ul class="dropdown-menu dropdown-menu-end bg-dark border-secondary">
                    <li><a class="dropdown-item text-light pixel-font" href="perfil.html">Mi Perfil</a></li>
                    <li><hr class="dropdown-divider bg-secondary"></li>
                    <li><a class="dropdown-item text-danger pixel-font" href="#" id="btn-logout">Cerrar Sesión</a></li>
                </ul>
            </li>
        </ul>

    </div>
</nav>

<div class="container mt-5 container-custom text-center">

    <h2 class="pixel-font mb-4">Crear Clan</h2>
    <div class="text-center mb-4">
        <img id="preview-clan-img"
             src="img/clan/clan_default.png"
             alt="Imagen del clan"
             class="clan-preview-img">
    </div>


    <form id="form-crear-clan" class="mx-auto" style="max-width: 500px;">

        <div class="mb-3 text-start">
            <label class="pixel-font text-light">Nombre del clan</label>
            <input type="text" class="form-control" id="clan-nombre" required>
        </div>

        <div class="mb-3 text-start">
            <label class="pixel-font text-light">Descripción</label>
            <textarea class="form-control" id="clan-descripcion" rows="3" required></textarea>
        </div>

        <div class="mb-4 text-start">
            <label class="pixel-font text-light">Imagen del clan</label>
            <select id="clan-imagen"
                    class="form-select pixel-font clan-select">

            <option value="img/clan/clan_default.png" selected>
                    Default
                </option>
                <option value="img/clan/clan1.png">
                    Opción 1
                </option>
                <option value="img/clan/clan2.png">
                    Opción 2
                </option>
                <option value="img/clan/clan3.png">
                    Opción 3
                </option>
            </select>
        </div>
        <button type="submit" class="btn btn-warning pixel-font w-100">
            🚀 Crear Clan
        </button>

        <p id="mensaje-error" class="text-danger pixel-font mt-3 d-none"></p>
    </form>
</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/crear_clan.js"></script>
</body>
</html>
