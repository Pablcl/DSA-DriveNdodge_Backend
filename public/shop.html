<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tienda - DriveN'Dodge</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>

    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/styles2.css">
    <link rel="stylesheet" href="css/chat.css">
    <link rel="stylesheet" href="css/navbar.css">
</head>

<body class="landing-body clean-background2">

<nav class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top">
    <div class="container">
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto pixel-font">
                <li class="nav-item"><a class="nav-link active text-gold" href="shop.html">🛒 Tienda</a></li>
                <li class="nav-item"><a class="nav-link" href="inventario.html">🎒 Inventario</a></li>
                <li class="nav-item"><a class="nav-link" href="ranking.html">🏆 Ranking</a></li>
                <li class="nav-item"><a class="nav-link" href="clanes.html">🛡️ Clanes</a></li>
            </ul>

            <ul class="navbar-nav ms-auto align-items-center pixel-font">
                <li class="nav-item me-3">
                    <div class="d-flex align-items-center bg-dark border border-warning rounded px-3 py-1">
                        <span class="me-2">💰</span>
                        <span id="coins-display" class="fw-bold text-white">---</span>
                    </div>
                </li>

                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle pixel-font" href="#" id="userDropdown" role="button" data-bs-toggle="dropdown">
                        👤 <span id="username-display">Usuari</span>
                    </a>

                    <ul class="dropdown-menu dropdown-menu-end bg-dark border-secondary">
                        <li><a class="dropdown-item text-light pixel-font" href="perfil.html">Mi Perfil</a></li>
                        <li><hr class="dropdown-divider bg-secondary"></li>
                        <li><a class="dropdown-item text-danger pixel-font" href="#" id="btn-logout">Cerrar Sesión</a></li>
                    </ul>
                </li>

            </ul>
        </div>
    </div>
</nav>

<div class="container mt-5 container-custom shop-container">
    <h2 class="text-center mb-5 pixel-font">Tienda de items</h2>
    <div id="shop-items-container" class="row">
        <div class="text-center py-5">
            <div class="spinner-border text-warning" role="status">
                <span class="visually-hidden">Cargando...</span>
            </div>
        </div>
    </div>
</div>

<!-- Modal de confirmación -->
<div class="modal fade" id="confirmModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content bg-dark text-white pixel-font">
            <div class="modal-header border-bottom-0">
                <h5 class="modal-title text-gold">Confirmar Compra</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <p id="confirm-message" class="mb-0"></p>
            </div>
            <div class="modal-footer border-top-0 justify-content-end gap-3">
                <button type="button" class="btn btn-secondary pixel-font" data-bs-dismiss="modal">Cancelar</button>
                <button type="button" id="confirm-yes" class="btn btn-secondary pixel-font">Comprar</button>
            </div>
        </div>
    </div>
</div>

<!-- Toast container -->
<div id="toast-container" class="position-fixed bottom-0 end-0 p-3" style="z-index: 1080;"></div>

<!-- Chat IA -->
<div id="chat-launcher" onclick="toggleChat()">
    <img src="img/ia_logo.png" alt="IA">
</div>

<div id="chat-window" class="hidden">
    <div class="chat-header">
        <span>Chat IA</span>
        <button class="btn-close-chat" onclick="toggleChat()">X</button>
    </div>

    <div id="chat-messages">
        <div class="message ai">
            <div class="bubble">Sistemas online. Bienvenido a la tienda, piloto.</div>
        </div>
    </div>

    <div class="chat-input-area">
        <input type="text" id="chat-input" placeholder="Consultar a la IA..." autocomplete="off">
        <button id="btn-chat-send">ENVIAR</button>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/shop.js"></script>
<script src="js/chat.js"></script>
</body>
</html>
